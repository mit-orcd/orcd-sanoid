# Discovery policy for sanoid-config.
# Installed to /etc/sanoid/sanoid-discover.conf. A later install leaves this
# file in place, so host-specific pools and excludes survive a reinstall.
#
# Uniform hourly/daily/monthly counts live in sanoid.conf.template
# ([template_production]), not in this file.

# Template name without the template_ prefix.
default_template=production

# yes: sanoid-discover.service configures each new dataset (data1/xyz and
# data1/xyz/abc) with template_production and sets
# com.sun:auto-snapshot=true. A dataset set to false stays out.
# Turn one off with:  sanoid-config disable data1/orcd
# no: write sanoid.conf without changing the ZFS property.
require_auto_snapshot=yes

# Which enabled datasets are written into sanoid.conf.
#   all       every filesystem and volume except pool roots
#   children  only the direct child of each pool (data1/edboyden)
depth=all

# Optional pool allow-list, comma-separated. Unset means every imported pool.
# Set this when the host also has an OS pool that should not be snapshotted.
# pools=data1

# Optional dataset globs, one pattern per line.
# exclude=rpool/*
# exclude=data1/scratch*
